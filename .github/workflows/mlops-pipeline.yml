name: ML Pipeline - Diabetes Regression

on:
  workflow_dispatch: {}

env:
  MODEL_NAME: diabetes_regression_model
  IMAGE_NAME: ghcr.io/${{ github.repository }}/diabetes-model-server

jobs:
  # ---------------------------------------------------------------------
  # 1) Data validation - schema, missing values, distribution drift checks
  # ---------------------------------------------------------------------
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_data_validation.py -v

  # ---------------------------------------------------------------------
  # 2) Train -> evaluate -> register against the MLflow server you run on
  # ---------------------------------------------------------------------
  train-and-deploy:
    needs: data-validation
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Train model
        id: train
        run: python src/train.py --data-path data/diabetes.csv --params-path parameters.json

      - name: Evaluate against current production model
        id: evaluate
        run: python src/evaluate.py --run-id "${{ steps.train.outputs.run_id }}" --model-name "$MODEL_NAME"

      - name: Register model as new production version
        if: steps.evaluate.outputs.promote == 'true'
        run: python src/register.py --run-id "${{ steps.train.outputs.run_id }}" --model-name "$MODEL_NAME"

      - name: Download production model
        if: steps.evaluate.outputs.promote == 'true'
        run: mlflow artifacts download --artifact-uri "models:/${MODEL_NAME}@production" --dst-path ./model

      - name: Build serving image
        if: steps.evaluate.outputs.promote == 'true'
        run: docker build -f Dockerfile.model-server -t "diabetes-model-server:${{ github.sha }}" .

      - name: Log in to GHCR
        if: steps.evaluate.outputs.promote == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: steps.evaluate.outputs.promote == 'true'
        run: |
          docker tag diabetes-model-server:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: Smoke test the deployed model
        if: steps.evaluate.outputs.promote == 'true'
        run: |
          curl -sf -X POST http://${{ vars.MODEL_SERVER_URI }}/invocations \
            -H "Content-Type: application/json" \
            -d '{"dataframe_split": {"columns": ["AGE","SEX","BMI","BP","S1","S2","S3","S4","S5","S6"], "data": [[0.038,0.050,0.061,0.021,-0.044,-0.034,-0.043,-0.002,0.019,-0.017]]}}'
