Outputs:
  MasterPublicIP:
    Description: Public IP of the k8s master node
    Value: !GetAtt K8sMasterInstance.PublicIp

  Worker1PublicIP:
    Description: Public IP of worker node 1
    Value: !GetAtt K8sWorkerInstance1.PublicIp

  Worker2PublicIP:
    Description: Public IP of worker node 2
    Value: !GetAtt K8sWorkerInstance2.PublicIp

  SSHToMaster:
    Description: SSH command to reach the master (kubeconfig at /root/.kube/config and /home/ec2-user/.kube/config)
    Value: !Sub "ssh -i <your-key>.pem ec2-user@${K8sMasterInstance.PublicIp}"

  SSHToWorker1:
    Description: SSH command to reach worker 1
    Value: !Sub "ssh -i <your-key>.pem ec2-user@${K8sWorkerInstance1.PublicIp}"

  SSHToWorker2:
    Description: SSH command to reach worker 2
    Value: !Sub "ssh -i <your-key>.pem ec2-user@${K8sWorkerInstance2.PublicIp}"
